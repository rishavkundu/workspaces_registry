name: Build and Deploy Kasm Registry

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'gh-pages/**'
  workflow_dispatch: {}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install processing deps
        run: npm ci --prefix processing

      - name: Generate registry payload (list.json, icons)
        run: node processing

      - name: Make build script executable
        run: chmod +x build_all_branches.sh

      - name: Build all branches
        run: ./build_all_branches.sh

      - name: Add CNAME and nojekyll (if present)
        run: |
          if [ -f CNAME ]; then cp CNAME public/CNAME; fi
          touch public/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          force_orphan: true
