name: Build and Publish to GHCR

on:
    push:
        branches: [main]
        tags: ["v*"]
        paths:
            - "workspaces/**"
            - ".github/workflows/build-publish-ghcr.yml"
    workflow_dispatch: {}

permissions:
    contents: read
    packages: write

concurrency:
    group: ghcr-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-publish:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: nousdebian
                      context: workspaces/NousDebian
                      file: workspaces/NousDebian/Dockerfile
                      image_name: rishavkundu/nousdebian

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup QEMU
              uses: docker/setup-qemu-action@v3

            - name: Setup Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ matrix.image_name }}
                  # Tags: semver (if pushing tags), branch, SHA, and conventional aliases
                  tags: |
                      type=raw,value=develop,enable=${{ github.ref == 'refs/heads/main' }}
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
                      type=raw,value=1.17.0   # pin per Kasm version schema channel
                      type=ref,event=branch
                      type=sha

            - name: Build and push (multi-arch)
              uses: docker/build-push-action@v6
              with:
                  context: ${{ matrix.context }}
                  file: ${{ matrix.file }}
                  push: true
                  platforms: linux/amd64,linux/arm64
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  provenance: false
                  sbom: false
                  labels: ${{ steps.meta.outputs.labels }}
                  tags: ${{ steps.meta.outputs.tags }}

    # Populate uncompressed_size_mb in registry workspaces after push
    post-update-sizes:
        needs: build-publish
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Install processing deps
              run: npm ci --prefix processing

            - name: Populate uncompressed sizes
              run: node processing/get_image_sizes.js

            - name: Commit size updates
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add workspaces/**/workspace.json
                  git commit -m "chore(registry): update uncompressed_size_mb from GH runner" || echo "No changes"
                  git push
