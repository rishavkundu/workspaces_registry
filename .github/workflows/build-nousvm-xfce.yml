name: Build and push NousVM-XFCE to GHCR

on:
  push:
    branches:
      - main
      - 'releases/**'
    paths:
      - 'workspaces/NousVM_XFCE/**'
      - '.github/workflows/build-nousvm-xfce.yml'
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: rishavkundu
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: workspaces/NousVM_XFCE
          file: workspaces/NousVM_XFCE/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/rishavkundu/nousvm-xfce:1.17.0
            ghcr.io/rishavkundu/nousvm-xfce:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag and push develop
        run: |
          docker pull ghcr.io/rishavkundu/nousvm-xfce:1.17.0
          docker tag ghcr.io/rishavkundu/nousvm-xfce:1.17.0 ghcr.io/rishavkundu/nousvm-xfce:develop
          docker push ghcr.io/rishavkundu/nousvm-xfce:develop

      - name: Install processing deps
        run: npm ci --prefix processing

      - name: Populate uncompressed sizes
        run: node processing/get_image_sizes.js

      - name: Commit workspace size updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workspaces/**/workspace.json
          git commit -m "chore(registry): populate uncompressed_size_mb for NousVM XFCE" || echo "No changes"
          git push


